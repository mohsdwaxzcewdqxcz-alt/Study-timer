<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
   <link rel="icon" type="image/x-icon" href="G:\Time exam\Icon\timo.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- هيدر علوي يضم زر التبديل بين الوضع الليلي/النهاري ومبدل اللغة -->
  <header class="top-header">
    <div class="controls-wrapper">
      <!-- مبدل اللغة -->
      <button class="lang-switch-btn" onclick="toggleLanguage()" title="Switch Language / تغيير اللغة">
        🌐 <span id="lang-btn-text">EN</span>
      </button>

      <!-- زر الوضع الليلي/النهاري -->
      <div class="theme-switch" onclick="toggleTheme()" title="تبديل الوضع / Toggle Theme">
        <div class="theme-btn light-icon">☀️</div>
        <div class="theme-btn dark-icon">🌙</div>
      </div>
    </div>
  </header>

  <div class="main-layout">
    <div class="container">
      <h1 data-i18n="main_title">مؤقت المذاكرة والواجب الورقي</h1>

      <!-- القائمة الرئيسية للمواد -->
      <div id="subject-selection" class="card view-screen">
        <h2 data-i18n="select_subject">اختر المادة للبدء</h2>
        <div id="subjects-grid" class="grid"></div>
      </div>

      <!-- نافذة اختيار نوع الجلسة (واجب / مذاكرة / تلخيص) -->
      <div id="session-type-screen" class="card view-screen hidden">
        <h2 id="selected-subject-title">المادة</h2>
        <p class="instruction" data-i18n="select_session_instruction">اختر نوع الجلسة التي تريد البدء فيها:</p>
        <div class="option-buttons">
          <button class="btn subject-btn" onclick="startHomeworkSession()" data-i18n="btn_homework">واجب (120 دقيقة)</button>
          <button class="btn study-btn" onclick="showCustomSetup('مذاكرة')" data-i18n="btn_study">مذاكرة درس</button>
          <button class="btn secondary-btn" onclick="showCustomSetup('تلخيص')" data-i18n="btn_summary">تلخيص مادة</button>
        </div>
        <button class="btn cancel-btn back-btn" onclick="showScreen('subject-selection')" data-i18n="btn_back">العودة للقائمة الرئيسية</button>
      </div>

      <!-- نافذة إعداد المذاكرة / التلخيص -->
      <div id="custom-setup-screen" class="card view-screen hidden">
        <h2 id="custom-setup-title">إعداد الجلسة</h2>
        <div class="form-group">
          <label for="custom-topic" id="custom-topic-label">عنوان الموضوع / الدرس:</label>
          <input type="text" id="custom-topic" placeholder="مثال: درس النحو، الوحدة الأولى..." class="input-field">
        </div>
        <div class="form-group">
          <label for="custom-time" data-i18n="label_time">المدة بالدقائق (من 1 إلى 120 دقيقة):</label>
          <input type="number" id="custom-time" min="1" max="120" value="60" class="input-field">
        </div>
        <div class="actions">
          <button class="btn success-btn" onclick="confirmCustomStart()" data-i18n="btn_start">ابدأ الجلسة</button>
          <button class="btn cancel-btn" onclick="showScreen('session-type-screen')" data-i18n="btn_cancel">إلغاء</button>
        </div>
      </div>

      <!-- شاشة المؤقت -->
      <div id="timer-screen" class="card view-screen hidden">
        <h2 id="current-subject-title">المادة</h2>
        <p id="timer-topic-detail" class="instruction-detail hidden"></p>
        <p class="instruction" data-i18n="timer_instruction">قم بالعمل في الكشكول/الورق الآن!</p>
        <div id="timer-display">120:00</div>
        <div class="actions">
          <button class="btn success-btn" onclick="finishTask()" data-i18n="btn_finish">انتهاء (أنهيت العمل)</button>
          <button class="btn cancel-btn" onclick="cancelTask()" data-i18n="btn_abort">إلغاء / حذف التجربة</button>
        </div>
      </div>

      <!-- شاشة النتيجة -->
      <div id="result-screen" class="card view-screen hidden">
        <h2 id="result-title">نتيجة الجلسة</h2>
        <p id="result-message"></p>
        <button class="btn primary-btn" onclick="showScreen('subject-selection')" data-i18n="btn_home">العودة للقائمة الرئيسية</button>
      </div>
    </div>

    <!-- السجل الجانبي -->
    <div class="sidebar card">
      <div class="sidebar-header">
        <h2 data-i18n="history_title">سجل الإنجازات والمذاكرة</h2>
        <button class="clear-all-btn" onclick="clearAllHistory()" data-i18n="btn_clear_all">مسح الكل</button>
      </div>
      <ul id="history-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
